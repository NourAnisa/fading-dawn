name: Browser visual checks
on:
  pull_request:
  push:
    branches: [codex/reference-bridge-scene]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: browser-artifacts/
